services:
  ocular-audio:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - ../.env
    volumes:
      - ocular-audio-cache:/home/ocular/.cache/ocular_audio_mcp
    init: true
    pids_limit: 256
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "scripts/docker_http_smoke.py", "--attempts", "1", "--interval", "0"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  ocular-audio-cache:

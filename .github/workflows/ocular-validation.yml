name: OcularAudio Validation

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    branches: ["main"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Compile Python
        run: python -m py_compile ocular_audio_mcp.py media_resolver.py evidence_index.py visual_index.py semantic_index.py multimodal_index.py batch_index.py agentic_index.py universal_sources.py capability_modes.py protocol_contract.py
      - name: Install MCP SDK v2
        run: python -m pip install --disable-pip-version-check "mcp>=2.0.0,<3"
      - name: Validate MCP SDK v2 surface
        run: python -c "from mcp.server import MCPServer; from mcp.server.mcpserver import Image; from mcp.types import ToolAnnotations; print(MCPServer.__name__, Image.__name__, ToolAnnotations.__name__)"
      - name: Install visual test dependency
        run: python -m pip install --disable-pip-version-check opencv-python-headless
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate CLI syntax
        run: node --check bin/cli.js
      - name: Validate package metadata
        run: node -e "const fs=require('fs'); const p=require('./package.json'); const s=JSON.parse(fs.readFileSync('server.json','utf8')); if(!/^1\.\d+\.\d+$/.test(p.version)) process.exit(1); if(s.version!==p.version || s.packages[0].version!==p.version) process.exit(1); console.log(p.name+' '+p.version)"

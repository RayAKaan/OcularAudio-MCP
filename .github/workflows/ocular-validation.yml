name: OcularAudio Validation

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    branches: ["main", "fix/**"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install system media dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg espeak-ng
      - name: Install full runtime dependency stack
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Compile Python
        run: python -m py_compile ocular_audio_mcp.py media_resolver.py evidence_index.py visual_index.py semantic_index.py multimodal_index.py batch_index.py agentic_index.py universal_sources.py capability_modes.py protocol_contract.py prompts.py deployment_security.py runtime_ops.py
      - name: Validate MCP SDK v2 surface
        run: python -c "from mcp.server import MCPServer; from mcp.server.mcpserver import Image; from mcp.types import ToolAnnotations; print(MCPServer.__name__, Image.__name__, ToolAnnotations.__name__)"
      - name: Run unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Validate CLI syntax
        run: node --check bin/cli.js
      - name: Validate release metadata
        run: npm run check
      - name: Verify MCP registry package exists
        run: |
          registry_version="$(node -p "require('./server.json').packages[0].version")"
          published_version="$(npm view "ocular-audio-mcp@${registry_version}" version)"
          test "${published_version}" = "${registry_version}"
      - name: Validate package contents
        run: npm pack --dry-run
